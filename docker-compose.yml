version: "3.7"

# Port exposure note: this stack holds depression biomarkers (PHI). Internal
# data-plane / inter-service ports (Mongo, Mongo Express, MQTT, and the layer APIs)
# are bound to 127.0.0.1 so they are reachable from the host (and via SSH tunnel) but
# NOT exposed on the LAN. Services talk to each other over the Docker network by name
# (e.g. http://analysis_layer:8083, mongodb://mongodb:27017), which is unaffected. Only
# the dashboard (users) and the respeaker TCP server (ESP32 boards) stay LAN-public.
# NOTE: authentication for Mongo/MQTT is still open; add credentials before exposing
# any of these beyond localhost.

services:
   mqtt:
      image: eclipse-mosquitto
      restart: unless-stopped
      ports:
         - "127.0.0.1:1883:1883"
      volumes:
         - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

   mongodb:
      image: mongo:latest
      container_name: mongodb
      restart: unless-stopped
      ports:
         - "127.0.0.1:27017:27017"
      volumes:
         - mongo_data:/data/db
      command: mongod --setParameter diagnosticDataCollectionEnabled=false

   mongo-express:
      image: mongo-express
      restart: unless-stopped
      ports:
         - "127.0.0.1:8081:8081"
      environment:
         ME_CONFIG_MONGODB_SERVER: mongodb
      depends_on:
         - mongodb

   voice_profiling:
      build:
         context: ./processing_layer/user_profiling/voice_profiling
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "127.0.0.1:8000:8000"
      volumes:
         - ./processing_layer/user_profiling/voice_profiling:/app
      depends_on:
         - mongodb

   voice_metrics:
      build:
         context: ./processing_layer/metrics_computation/voice_metrics
         dockerfile: Dockerfile
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 2G
      environment:
         - SYSTEM_MODE=live
      volumes:
         - ./processing_layer/metrics_computation/voice_metrics:/app
         - ./processing_layer/scene_analysis:/app/processing_layer/scene_analysis:ro
         - ./processing_layer/user_profiling/voice_profiling:/app/processing_layer/user_profiling/voice_profiling:ro
      depends_on:
         - mqtt
         - voice_profiling
         - mongodb

   respeaker_service:
      build:
         context: ./data_ingestion_layer
         dockerfile: Dockerfile.respeaker
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 512M
            reservations:
               memory: 256M
      ports:
         - "8010:8010"
      volumes:
         - ./data_ingestion_layer:/app
         - ./datasets:/app/datasets:ro
      depends_on:
         - mqtt
         - mongodb
      environment:
         - MONGO_URL=mongodb://mongodb:27017
         - MQTT_HOST=mqtt
         - MQTT_PORT=1883
         - BASE_PORT=8010

   quality_metrics_service:
      build:
         context: ./data_ingestion_layer
         dockerfile: Dockerfile.respeaker
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 256M
      command: python quality_metrics_service.py
      volumes:
         - ./data_ingestion_layer:/app
      depends_on:
         - mqtt
         - mongodb
      environment:
         - MONGO_URL=mongodb://mongodb:27017
         - MQTT_HOST=mqtt
         - MQTT_PORT=1883

   temporal_context_modeling_layer:
      build:
         context: ./temporal_context_modeling_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "127.0.0.1:8082:8082"
      depends_on:
         - mongodb

   analysis_layer:
      build:
         context: ./analysis_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 1G
      ports:
         - "127.0.0.1:8083:8083"
      depends_on:
         - mongodb

   dashboard_layer:
      build:
         context: ./dashboard_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "8084:8084"
      volumes:
         - ./analysis_layer/core:/app/core:ro
         - ./datasets:/app/datasets:ro
         - ./data_ingestion_layer:/app/data_ingestion_layer:ro
         - ./processing_layer/scene_analysis:/app/processing_layer/scene_analysis:ro
         - ./docs:/app/docs:ro
      depends_on:
         - mongodb
      environment:
         - PYTHONUNBUFFERED=1

volumes:
   mongo_data:
      # Pin the volume name so the stack reuses the existing data volume regardless of the
      # compose project/directory name. Without this, a project named "audio-depression-
      # detection" creates a fresh "audio-depression-detection_mongo_data" and the stack
      # starts with an EMPTY database instead of the existing demo/dataset/live data.
      name: depression-detection_mongo_data
