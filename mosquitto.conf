# mosquitto.conf
listener 1883
# Authentication required -- credentials in the mounted password_file (mosquitto.passwd,
# generated by scripts/setup_mqtt_auth.sh from MQTT_USER/MQTT_PASS, gitignored).
allow_anonymous false
password_file /mosquitto/config/passwd
# Cap message size (default is 256MB). One ~16s/16kHz audio chunk is ~0.5MB base64; 4MB is
# generous headroom and prevents a single oversized publish from OOM-ing the tight-mem
# consumers. Raise if longer chunks are ever sent.
message_size_limit 4194304
